name: Österreich Patch anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-austria-patch:
    name: Österreich-Daten patchen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Vorbedingungen prüfen
        run: |
          test -f data/nachtfragment.json
          test -f patch_austria_github.py
          echo "✓ data/nachtfragment.json gefunden"
          echo "✓ patch_austria_github.py gefunden"

      - name: Österreich-Patch ausführen
        run: python patch_austria_github.py

      - name: Ergebnis prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/nachtfragment.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, list):
              raise SystemExit("FEHLER: nachtfragment.json ist keine Top-Level-Liste.")

          ids = {str(item.get("id", "")) for item in data if isinstance(item, dict)}

          if "cafe-libella" not in ids:
              raise SystemExit("FEHLER: Café LiBella wurde nicht gefunden.")

          black_rose = [
              item for item in data
              if isinstance(item, dict)
              and (
                  str(item.get("id", "")).lower() == "black-rose"
                  or (
                      str(item.get("name", "")).strip().lower() == "black rose"
                      and str(item.get("city", "")).strip().lower() in {"vienna", "wien"}
                  )
              )
          ]

          if black_rose:
              raise SystemExit("FEHLER: Black Rose ist noch in der Datenbank.")

          # Doppelte IDs würden den Import unnötig unsicher machen.
          seen = set()
          duplicates = []
          for item in data:
              if isinstance(item, dict) and item.get("id"):
                  item_id = str(item["id"])
                  if item_id in seen:
                      duplicates.append(item_id)
                  seen.add(item_id)

          if duplicates:
              raise SystemExit(
                  "FEHLER: doppelte IDs gefunden: " + ", ".join(sorted(set(duplicates)))
              )

          print(f"✓ JSON gültig: {len(data)} Einträge")
          print("✓ Café LiBella vorhanden")
          print("✓ Black Rose entfernt")
          print("✓ Keine doppelten IDs")
          PY

      - name: Änderungen anzeigen
        run: |
          git status --short
          git diff --stat
          git diff -- data/nachtfragment.json | head -n 250

      - name: Änderungen committen und pushen
        run: |
          # Das vom Patch erzeugte Backup wird nicht ins Repository übernommen.
          rm -f data/nachtfragment.before_austria_patch.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nachtfragment.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden. Nichts zu committen."
            exit 0
          fi

          git commit -m "Datenbank: Österreich ergänzen und Black Rose entfernen"
          git push

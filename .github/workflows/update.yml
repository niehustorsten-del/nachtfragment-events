name: Nachtfragment Auto Update – Events & Festivals

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with Scene Discovery to prevent concurrent writes to the same JSON files.
concurrency:
  group: nachtfragment-auto-update
  cancel-in-progress: false

jobs:
  update:
    name: Events und Festivals aktualisieren
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "false"

      - name: Eingabedateien und JSON prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f updater.py
          test -f discovery_sources.json
          test -f search_queries.json
          test -f data/nachtfragment.json
          test -f data/candidates.json
          test -f data/changes.json
          test -f data/geocache.json

          python -m py_compile updater.py
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "data/nachtfragment.json",
              "data/candidates.json",
              "data/changes.json",
              "data/geocache.json",
              "discovery_sources.json",
              "search_queries.json",
          ]
          for name in files:
              path = Path(name)
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"OK: {name}")
          PY

      - name: Events und Festivals aktualisieren
        run: python updater.py

      - name: Ausgabedateien validieren
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "data/nachtfragment.json",
              "data/candidates.json",
              "data/changes.json",
              "data/geocache.json",
          ]
          for name in required:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Fehlende Ausgabedatei: {name}")
              with path.open("r", encoding="utf-8") as handle:
                  data = json.load(handle)
              if not isinstance(data, (list, dict)):
                  raise SystemExit(f"Unerwartetes JSON-Format: {name}")
              print(f"OK: {name}")
          PY

      - name: Geänderte Daten committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nachtfragment Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/nachtfragment.json \
            data/candidates.json \
            data/changes.json \
            data/geocache.json \
            data/status.json

          if git diff --cached --quiet; then
            echo "Keine Datenänderungen – nichts zu committen."
            exit 0
          fi

          git commit -m "Update Nachtfragment events and festivals"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Nachtfragment Artist Activity Feed

on:
  push:
    branches: [main]
    paths:
      - "discover_artist_news.py"
      - "build_artist_activity.py"
      - ".github/workflows/artist-activity-update.yml"
      - "data/artists.json"
      - "data/artist-news.json"
  schedule:
    - cron: "45 6 * * 3,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nachtfragment-repository-updates
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Öffentliche Künstlernews für alle Artists suchen
        env:
          ARTIST_NEWS_MAX_ARTISTS: "0"
        run: python discover_artist_news.py
      - name: Aktivitätsfeed erzeugen
        run: python build_artist_activity.py
      - name: JSON validieren
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = json.loads(Path("data/artist-news-candidates.json").read_text(encoding="utf-8"))
          feed = json.loads(Path("data/artist-activity.json").read_text(encoding="utf-8"))
          assert candidates.get("approval_required") is True
          assert isinstance(candidates.get("items"), list)
          assert isinstance(feed.get("artists"), dict)
          assert feed.get("artist_count") == len(feed["artists"])
          print("News-Kandidaten:", candidates.get("candidate_count", 0))
          print("Aktivitätsfeed:", feed["artist_count"], "Künstler /", feed.get("news_count", 0), "freigegebene News")
          PY
      - name: Feeds veröffentlichen
        run: |
          git config user.name "Nachtfragment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/artist-news-candidates.json data/artist-activity.json
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Update artist news candidates and activity feed"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

name: Nachtfragment Artist Facebook Finder
on:
  schedule:
    - cron: "20 7 * * 0"
  workflow_dispatch:
  push:
    paths:
      - 'artist_facebook_discovery.py'
      - 'data/artists.json'
      - '.github/workflows/artist-facebook-follow.yml'
permissions:
  contents: write
concurrency:
  group: nachtfragment-repository-updates
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: python -m pip install requests beautifulsoup4
      - name: Öffentliche Facebook-Seiten finden
        env:
          FACEBOOK_MAX_ARTISTS: "0"
          FACEBOOK_QUERY_PAUSE: "1.4"
        run: python artist_facebook_discovery.py
      - name: Ergebnis prüfen
        run: python -c "import json; d=json.load(open('data/facebook-artists.json',encoding='utf-8')); assert isinstance(d.get('artists'),list); print('Artists:',d.get('count'))"
      - name: Ergebnisse committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nachtfragment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/artists.json data/facebook-artists.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Update Nachtfragment artist Facebook links"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

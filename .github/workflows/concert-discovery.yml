name: Konzertsuche

on:
  workflow_dispatch:
  schedule:
    # Einmal pro Woche: sonntags um 06:20 UTC
    - cron: "20 6 * * 0"

permissions:
  contents: write

concurrency:
  group: konzertsuche
  cancel-in-progress: false

jobs:
  discover-concerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests feedparser beautifulsoup4
          fi

      - name: Konzertsuche ausführen
        run: python concerts_discovery.py

      - name: Suchergebnisse speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/concert_candidates.json data/concerts_status.json concerts.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Suchergebnissen."
          else
            git commit -m "Aktualisiere Konzertsuche und veröffentliche Termine"
            git push
          fi

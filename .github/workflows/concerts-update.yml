name: Nachtfragment Concert Discovery

on:
  schedule:
    # Mittwoch und Sonntag, 05:35 UTC (06:35 Winter / 07:35 Sommer in Hamburg)
    - cron: "35 5 * * 3,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nachtfragment-concert-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Eingabedateien prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f concerts_discovery.py
          test -f data/artists.json
          test -f data/concert_sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("data/artists.json", "data/concert_sources.json"):
              with Path(name).open(encoding="utf-8") as f:
                  obj = json.load(f)
              assert isinstance(obj, (dict, list)), name
              print("OK:", name)
          PY

      - name: Öffentliche Künstler- und Szenekalender durchsuchen
        env:
          CONCERTS_MAX_ARTISTS: "0"
          CONCERTS_MAX_PAGE_CHECKS: "240"
          CONCERTS_QUERY_PAUSE: "0.6"
          CONCERTS_RSS_ENABLED: "0"
          CONCERTS_RSS_RESULTS: "18"
        run: python concerts_discovery.py

      - name: Ergebnisdateien validieren
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("data/concert_candidates.json", "data/concerts_status.json", "concerts.json"):
              p = Path(name)
              if not p.is_file():
                  raise SystemExit(f"Datei fehlt: {name}")
              with p.open(encoding="utf-8") as f:
                  json.load(f)
              print("OK:", name)
          PY

      - name: Rechercheergebnisse committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nachtfragment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add concerts_discovery.py data/concert_sources.json data/concert_candidates.json data/concerts_status.json concerts.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu committen."
            exit 0
          fi
          git commit -m "Expand Nachtfragment concert discovery"
          git push origin "HEAD:${GITHUB_REF_NAME}"

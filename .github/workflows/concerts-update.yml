name: Nachtfragment Concert Discovery
on:
  schedule:
    - cron: "35 5 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nachtfragment-concert-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover artists and concert candidates
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NACHTFRAGMENT_SITE: https://nachtfragment.de
        run: python concerts_discovery.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artists.json data/concerts.json data/concert_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Nachtfragment concert discovery data"
            git push
          else
            echo "No data changes."
          fi
